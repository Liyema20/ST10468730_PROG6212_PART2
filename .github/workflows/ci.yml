name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -d docs
          test -f README.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --no-restore -c Release

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-build -c Release --verbosity normal
