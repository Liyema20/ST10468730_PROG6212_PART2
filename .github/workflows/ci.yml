 name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -d docs
          test -f README.md

      - name: Locate test project
        run: |
          PROJ=$(find . -name "RaceDay.Tests.csproj" | head -n 1)
          echo "Found: $PROJ"
          test -n "$PROJ"
          echo "TEST_PROJECT=$PROJ" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Build
        run: dotnet build "$TEST_PROJECT" --no-restore -c Release

      - name: Run unit tests
        run: dotnet test "$TEST_PROJECT" --no-build -c Release --verbosity normal
